<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 786" role="img" aria-labelledby="title desc"><title id="title">From a saved request to a checked result</title><desc id="desc">Save my-request.md containing the corrected bill of 215 and book of 200. Select it with at-sign, send the step 8 task, then open outputs/exception-note.md and verify a difference of positive 15 with cause unknown.</desc><rect width="1200" height="786" rx="20" fill="#080f1c"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="53" font-size="33" fill="#fff" font-weight="700">From a saved request to a checked result</text><text x="40" y="88" font-size="18" fill="#83baff" font-weight="400">WORKED EXAMPLE · Illustration, not an application screenshot</text><rect x="32" y="123" width="535" height="277" rx="14" fill="#101f36" stroke="#345473"/><text x="58" y="167" font-size="24" fill="#83baff" font-weight="700">1  SAVE YOUR REQUEST</text><text x="58" y="211" font-size="28" fill="#fff" font-weight="600">my-request.md</text><text x="58" y="257" font-size="24" fill="#dbe8fa" font-weight="400">Book: $200</text><text x="58" y="295" font-size="24" fill="#dbe8fa" font-weight="400">Bill: corrected to $215</text><text x="58" y="333" font-size="24" fill="#dbe8fa" font-weight="400">Wanted: one exception note</text><text x="58" y="375" font-size="20" fill="#dbe8fa" font-weight="400">Excerpt from step 7; keep the full request.</text><text x="588" y="266" font-size="34" fill="#83baff" font-weight="700">→</text><rect x="635" y="123" width="533" height="277" rx="14" fill="#101f36" stroke="#345473"/><text x="661" y="167" font-size="24" fill="#83baff" font-weight="700">2  SEND IT TO CLAUDE</text><text x="661" y="211" font-size="28" fill="#fff" font-weight="600">@my-request.md</text><text x="661" y="257" font-size="24" fill="#dbe8fa" font-weight="400">Choose the file suggestion.</text><text x="661" y="295" font-size="24" fill="#dbe8fa" font-weight="400">Add the step 8 task prompt.</text><text x="661" y="333" font-size="24" fill="#dbe8fa" font-weight="400">Send once in Claude’s message box.</text><text x="661" y="375" font-size="20" fill="#dbe8fa" font-weight="400">Saving alone does not send anything.</text><rect x="32" y="435" width="1136" height="263" rx="14" fill="#101f36" stroke="#345473"/><text x="58" y="481" font-size="24" fill="#83baff" font-weight="700">3  OPEN AND CHECK THE NEW OUTPUT</text><text x="58" y="527" font-size="29" fill="#fff" font-weight="600">outputs / exception-note.md</text><text x="58" y="575" font-size="28" fill="#fff" font-weight="600">Expected calculation: 215 - 200 = +15</text><text x="58" y="620" font-size="23" fill="#dbe8fa" font-weight="400">Cause: unknown. Next check: compare the supporting bill and book record.</text><text x="58" y="666" font-size="22" fill="#dbe8fa" font-weight="400">Expand outputs in VS Code’s Explorer, then double-click exception-note.md.</text><text x="42" y="746" font-size="22" fill="#dbe8fa" font-weight="400">Expected example only. Verify the actual saved file; preserve the request and earlier outputs.</text></g></svg>
