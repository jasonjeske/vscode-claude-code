<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc"><title id="title">The work loop</title><desc id="desc">Name the task, select inputs, ask Claude, check evidence, save the next step.</desc><rect width="1120" height="340" rx="20" fill="#f4f7fb"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b42}.h{font-size:28px;font-weight:700}.label{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#465b70}.n{font-size:18px;fill:white;font-weight:700}</style><text x="32" y="49" class="h">A small, repeatable work loop</text><text x="32" y="79" class="small">One useful task. One clear check. Then the next step.</text><rect x="32" y="112" width="192" height="142" rx="12" fill="#ffffff" stroke="#cad6e2"/><circle cx="59" cy="140" r="16" fill="#176b72"/><text x="54" y="146" class="n">1</text><text x="48" y="185" class="label">Name the task</text><text x="48" y="215" class="body">One outcome</text><text x="48" y="239" class="body">and period</text><path d="M230 180h12m-5-5 5 5-5 5" stroke="#60788e" stroke-width="2" fill="none"/><rect x="248" y="112" width="192" height="142" rx="12" fill="#ffffff" stroke="#cad6e2"/><circle cx="275" cy="140" r="16" fill="#176b72"/><text x="270" y="146" class="n">2</text><text x="264" y="185" class="label">Select inputs</text><text x="264" y="215" class="body">Only approved</text><text x="264" y="239" class="body">relevant sources</text><path d="M446 180h12m-5-5 5 5-5 5" stroke="#60788e" stroke-width="2" fill="none"/><rect x="464" y="112" width="192" height="142" rx="12" fill="#ffffff" stroke="#cad6e2"/><circle cx="491" cy="140" r="16" fill="#176b72"/><text x="486" y="146" class="n">3</text><text x="480" y="185" class="label">Ask Claude</text><text x="480" y="215" class="body">Clear rules</text><text x="480" y="239" class="body">and output</text><path d="M662 180h12m-5-5 5 5-5 5" stroke="#60788e" stroke-width="2" fill="none"/><rect x="680" y="112" width="192" height="142" rx="12" fill="#ffffff" stroke="#cad6e2"/><circle cx="707" cy="140" r="16" fill="#176b72"/><text x="702" y="146" class="n">4</text><text x="696" y="185" class="label">Check evidence</text><text x="696" y="215" class="body">Totals, sources,</text><text x="696" y="239" class="body">exceptions</text><path d="M878 180h12m-5-5 5 5-5 5" stroke="#60788e" stroke-width="2" fill="none"/><rect x="896" y="112" width="192" height="142" rx="12" fill="#ffffff" stroke="#cad6e2"/><circle cx="923" cy="140" r="16" fill="#176b72"/><text x="918" y="146" class="n">5</text><text x="912" y="185" class="label">Save next step</text><text x="912" y="215" class="body">Short handoff</text><text x="912" y="239" class="body">when needed</text><text x="32" y="305" class="body">Use Guided mode for a new task; Routine mode for an established process.</text></svg>
