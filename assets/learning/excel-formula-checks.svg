<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 778" role="img" aria-labelledby="title desc"><title id="title">One formula. Three checks in Excel.</title><desc id="desc">Synthetic worksheet has property P-002, book 200, bill 210, and difference 10. The guarded difference formula shows Missing input for an empty C2 and negative 200 for numeric zero. Test changes on a separate copy.</desc><rect width="1200" height="778" rx="20" fill="#080f1c"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="53" font-size="33" fill="#fff" font-weight="700">One formula. Three checks in Excel.</text><text x="40" y="88" font-size="18" fill="#83baff" font-weight="400">WORKED EXAMPLE · Illustration, not an application screenshot</text><rect x="32" y="124" width="1136" height="225" rx="14" fill="#101f36" stroke="#345473"/><text x="58" y="166" font-size="22" fill="#83baff" font-weight="700">INITIAL PRACTICE SHEET</text><path d="M58 190L1141 190" stroke="#53789e" stroke-width="2"/><path d="M58 254L1141 254" stroke="#53789e" stroke-width="2"/><path d="M58 319L1141 319" stroke="#53789e" stroke-width="2"/><path d="M58 190L58 319" stroke="#53789e" stroke-width="2"/><path d="M336 190L336 319" stroke="#53789e" stroke-width="2"/><path d="M548 190L548 319" stroke="#53789e" stroke-width="2"/><path d="M760 190L760 319" stroke="#53789e" stroke-width="2"/><path d="M1141 190L1141 319" stroke="#53789e" stroke-width="2"/><text x="77" y="233" font-size="25" fill="#fff" font-weight="600">A · Property</text><text x="353" y="233" font-size="25" fill="#fff" font-weight="600">B · Book</text><text x="565" y="233" font-size="25" fill="#fff" font-weight="600">C · Bill</text><text x="778" y="233" font-size="25" fill="#fff" font-weight="600">D · Difference</text><text x="77" y="296" font-size="27" fill="#fff" font-weight="400">P-002</text><text x="353" y="296" font-size="27" fill="#fff" font-weight="400">200</text><text x="565" y="296" font-size="27" fill="#fff" font-weight="400">210</text><text x="778" y="296" font-size="27" fill="#fff" font-weight="400">10</text><text x="42" y="396" font-size="23" fill="#83baff" font-weight="700">SELECT D2 AND CHECK THE FORMULA BAR</text><text x="42" y="440" font-size="28" fill="#fff" font-weight="600">=IF(OR(B2=&quot;&quot;,C2=&quot;&quot;),&quot;Missing input&quot;,C2-B2)</text><text x="42" y="483" font-size="23" fill="#dbe8fa" font-weight="400">In a saved check copy, keep B2 = 200. Change only C2 for each test.</text><rect x="32" y="517" width="364" height="128" rx="14" fill="#101f36" stroke="#345473"/><text x="54" y="559" font-size="23" fill="#83baff" font-weight="600">C2 contains 210</text><text x="54" y="607" font-size="24" fill="#fff" font-weight="600">D2 shows 10</text><rect x="418" y="517" width="364" height="128" rx="14" fill="#101f36" stroke="#345473"/><text x="440" y="559" font-size="23" fill="#83baff" font-weight="600">C2 is empty</text><text x="440" y="607" font-size="24" fill="#fff" font-weight="600">D2 shows Missing input</text><rect x="804" y="517" width="364" height="128" rx="14" fill="#101f36" stroke="#345473"/><text x="826" y="559" font-size="23" fill="#83baff" font-weight="600">C2 contains numeric 0</text><text x="826" y="607" font-size="24" fill="#fff" font-weight="600">D2 shows -200</text><text x="42" y="696" font-size="24" fill="#fff" font-weight="600">An empty bill is missing evidence. It is not the same as a known numeric zero.</text><text x="42" y="739" font-size="23" fill="#dbe8fa" font-weight="400">Restore C2 to 210 after testing. Reopen and check the file in native Excel.</text></g></svg>
