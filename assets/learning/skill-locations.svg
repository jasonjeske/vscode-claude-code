<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 866" role="img" aria-labelledby="title desc"><title id="title">Copy once. Use across local projects.</title><desc id="desc">Copy the six folders from the starter skills directory to the personal .claude skills directory. Each skill folder contains SKILL.md. Personal skills are available to multiple local projects.</desc><rect width="1200" height="866" rx="20" fill="#080f1c"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="54" font-size="34" fill="#ffffff" font-weight="700">Copy once. Use across local projects.</text><text x="40" y="88" font-size="18" fill="#83baff" font-weight="400">CONCEPT DIAGRAM · Follow alongside the walkthrough</text><rect x="32" y="122" width="1136" height="157" rx="16" fill="#101f36" stroke="#345473"/><path d="M59 163h18l6 7h32v34h-56z" fill="#418ff5" stroke="#91c4ff" stroke-width="2"/><text x="143" y="164" font-size="25" fill="#83baff" font-weight="600">SOURCE · The downloaded starter</text><text x="143" y="208" font-size="28" fill="#fff" font-weight="600">vscode-claude-code-main / skills /</text><text x="143" y="248" font-size="22" fill="#dbe8fa" font-weight="400">Contains six complete skill folders. This is a supply folder, not an install.</text><text x="568" y="328" font-size="26" fill="#83baff" font-weight="700">↓ COPY</text><rect x="32" y="352" width="1136" height="189" rx="16" fill="#101f36" stroke="#345473"/><path d="M59 396h18l6 7h32v34h-56z" fill="#418ff5" stroke="#91c4ff" stroke-width="2"/><text x="143" y="395" font-size="25" fill="#83baff" font-weight="600">DESTINATION · Personal skills for this Windows account</text><text x="143" y="442" font-size="30" fill="#fff" font-weight="600">%USERPROFILE%\.claude\skills</text><text x="143" y="481" font-size="23" fill="#dbe8fa" font-weight="400">Paste the six folders here once. Each keeps its SKILL.md inside.</text><text x="143" y="515" font-size="22" fill="#dbe8fa" font-weight="400">Available across local projects using this same Claude user configuration.</text><rect x="32" y="569" width="550" height="115" rx="16" fill="#101f36" stroke="#345473"/><text x="58" y="612" font-size="28" fill="#fff" font-weight="600">Practice-01</text><text x="58" y="651" font-size="23" fill="#dbe8fa" font-weight="400">Uses the personal skills</text><rect x="610" y="569" width="558" height="115" rx="16" fill="#101f36" stroke="#345473"/><text x="636" y="612" font-size="28" fill="#fff" font-weight="600">Another local work project</text><text x="636" y="651" font-size="23" fill="#dbe8fa" font-weight="400">Uses the same personal skills</text><text x="42" y="736" font-size="22" fill="#83baff" font-weight="600">One correct example:</text><text x="42" y="777" font-size="25" fill="#fff" font-weight="400">%USERPROFILE%\.claude\skills\excel-workbook-review\SKILL.md</text><text x="42" y="827" font-size="23" fill="#dbe8fa" font-weight="400">Do not create skills / skills. Do not put these in a .Claude Code folder.</text></g></svg>
