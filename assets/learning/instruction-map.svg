<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="377" viewBox="0 0 1120 377" role="img" aria-labelledby="title desc"><title id="title">Instruction locations</title><desc id="desc">Global preferences, project-specific rules, and the current request have different purposes. Evidence stays in approved work storage.</desc><rect width="1120" height="377" rx="20" fill="#f4f7fb"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b42}.h{font-size:28px;font-weight:700}.label{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#465b70}.n{font-size:18px;fill:white;font-weight:700}</style><text x="32" y="49" class="h">Where your instructions belong</text><text x="32" y="79" class="small">Keep stable preferences short. Put task details close to the work.</text><rect x="32" y="112" width="320" height="160" rx="12" fill="#ffffff" stroke="#cad6e2"/><text x="50" y="148" class="label">Global CLAUDE.md</text><text x="50" y="184" class="body">Across projects</text><text x="50" y="213" class="body">Teaching and writing style</text><text x="50" y="242" class="body">Preservation and verification</text><rect x="400" y="112" width="320" height="160" rx="12" fill="#ffffff" stroke="#cad6e2"/><text x="418" y="148" class="label">Project CLAUDE.md</text><text x="418" y="184" class="body">One related objective</text><text x="418" y="213" class="body">Period, sources, keys, controls</text><text x="418" y="242" class="body">Approved output and reviewer</text><rect x="768" y="112" width="320" height="160" rx="12" fill="#ffffff" stroke="#cad6e2"/><text x="786" y="148" class="label">Today&#x27;s prompt</text><text x="786" y="184" class="body">This specific task</text><text x="786" y="213" class="body">Selected inputs and changes</text><text x="786" y="242" class="body">One requested deliverable</text><rect x="32" y="291" width="1056" height="61" rx="12" fill="#e8f2f2" stroke="#cad6e2"/><text x="50" y="317" class="label">Evidence stays in approved work storage.</text><text x="50" y="342" class="small">Filled templates and work records stay out of the public starter.</text></svg>
