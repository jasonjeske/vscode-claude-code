<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">Your downloaded guide and your working project</title><desc id="desc">After extraction and copying, Claude-Learning contains the starter vscode-claude-code-main and a separate Practice-01 folder. Open only Practice-01 as the VS Code project. Selected files are shown, not the entire starter tree.</desc><rect width="1200" height="750" rx="20" fill="#080f1c"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="53" font-size="33" fill="#fff" font-weight="700">Your downloaded guide and your working project</text><text x="40" y="88" font-size="18" fill="#83baff" font-weight="400">WORKED EXAMPLE · Illustration, not an application screenshot</text><rect x="32" y="118" width="1136" height="85" rx="14" fill="#101f36" stroke="#345473"/><text x="57" y="155" font-size="25" fill="#fff" font-weight="600">Download ZIP → Extract All → Copy practice-project → Rename the copy</text><text x="57" y="186" font-size="22" fill="#dbe8fa" font-weight="400">The layout below is what you should have after README step 3.</text><rect x="32" y="227" width="663" height="438" rx="14" fill="#101f36" stroke="#345473"/><text x="58" y="271" font-size="28" fill="#fff" font-weight="600">Claude-Learning</text><path d="M78 284L78 610" stroke="#53789e" stroke-width="2"/><path d="M78 316L106 316" stroke="#53789e" stroke-width="2"/><path d="M78 493L106 493" stroke="#53789e" stroke-width="2"/><text x="119" y="325" font-size="26" fill="#83baff" font-weight="600">vscode-claude-code-main</text><text x="149" y="367" font-size="23" fill="#dbe8fa" font-weight="400">README.md</text><text x="149" y="404" font-size="23" fill="#dbe8fa" font-weight="400">skills</text><text x="149" y="441" font-size="23" fill="#dbe8fa" font-weight="400">practice-project</text><rect x="104" y="464" width="561" height="48" rx="6" fill="#214d7c"/><text x="119" y="497" font-size="27" fill="#fff" font-weight="700">Practice-01</text><text x="149" y="547" font-size="23" fill="#dbe8fa" font-weight="400">CLAUDE.md</text><text x="149" y="584" font-size="23" fill="#dbe8fa" font-weight="400">prompts / example-task.md</text><text x="149" y="622" font-size="23" fill="#dbe8fa" font-weight="400">inputs, outputs, working, evidence</text><text x="738" y="307" font-size="23" fill="#83baff" font-weight="700">KEEP THE STARTER</text><text x="738" y="348" font-size="23" fill="#dbe8fa" font-weight="400">Read the guide here.</text><text x="738" y="384" font-size="23" fill="#dbe8fa" font-weight="400">Copy skills from here.</text><text x="738" y="492" font-size="22" fill="#83baff" font-weight="700">OPEN THIS COPY IN VS CODE</text><text x="738" y="535" font-size="25" fill="#fff" font-weight="600">File &gt; Open Folder</text><text x="738" y="573" font-size="23" fill="#dbe8fa" font-weight="400">Choose Practice-01.</text><text x="43" y="711" font-size="23" fill="#dbe8fa" font-weight="400">Both folders sit beside each other. Your work goes in Practice-01, outside the starter.</text></g></svg>
