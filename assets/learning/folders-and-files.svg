<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 754" role="img" aria-labelledby="title desc"><title id="title">A project is a folder. Your request is a file.</title><desc id="desc">Practice-01 contains prompts, which contains example-task.md. Open the project in VS Code, expand prompts, then open the file.</desc><rect width="1200" height="754" rx="20" fill="#080f1c"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="54" font-size="34" fill="#ffffff" font-weight="700">A project is a folder. Your request is a file.</text><text x="40" y="88" font-size="18" fill="#83baff" font-weight="400">CONCEPT DIAGRAM · Follow alongside the walkthrough</text><rect x="32" y="122" width="1136" height="126" rx="16" fill="#101f36" stroke="#345473"/><text x="54" y="165" font-size="27" fill="#83baff" font-weight="700">1</text><text x="118" y="165" font-size="28" fill="#fff" font-weight="600">A folder holds related things</text><text x="118" y="207" font-size="24" fill="#dbe8fa" font-weight="400">Practice-01 is the project folder you open in VS Code.</text><path d="M1050 158h18l6 7h32v34h-56z" fill="#418ff5" stroke="#91c4ff" stroke-width="2"/><rect x="32" y="264" width="1136" height="126" rx="16" fill="#101f36" stroke="#345473"/><text x="54" y="307" font-size="27" fill="#83baff" font-weight="700">2</text><text x="118" y="307" font-size="28" fill="#fff" font-weight="600">A subfolder is a folder inside another</text><text x="118" y="349" font-size="24" fill="#dbe8fa" font-weight="400">prompts holds saved task requests inside Practice-01.</text><path d="M1050 300h18l6 7h32v34h-56z" fill="#418ff5" stroke="#91c4ff" stroke-width="2"/><rect x="32" y="406" width="1136" height="126" rx="16" fill="#101f36" stroke="#345473"/><text x="54" y="449" font-size="27" fill="#83baff" font-weight="700">3</text><text x="118" y="449" font-size="28" fill="#fff" font-weight="600">A file contains the actual content</text><text x="118" y="491" font-size="24" fill="#dbe8fa" font-weight="400">example-task.md is a Markdown text file inside prompts.</text><path d="M1050 441h25l12 12v40h-37z M1075 441v12h12" fill="#183e67" stroke="#a6d0ff" stroke-width="2"/><path d="M1058 465h21m-21 9h21m-21 9h13" stroke="#a6d0ff" stroke-width="2"/><text x="44" y="582" font-size="24" fill="#83baff" font-weight="600">Read the path from left to right:</text><text x="44" y="628" font-size="31" fill="#fff" font-weight="600">Practice-01  /  prompts  /  example-task.md</text><text x="44" y="673" font-size="23" fill="#dbe8fa" font-weight="400">Open project → Expand folder → Open file</text><text x="44" y="719" font-size="23" fill="#dbe8fa" font-weight="400">Saving a file does not send it to Claude. Select it with @ in Claude’s message box.</text></g></svg>
