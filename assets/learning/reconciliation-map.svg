<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">A complete reconciliation bridge</title><desc id="desc">Book totals 1000 dollars and bill totals 1110 dollars. The 110 dollar difference is 10 paired plus 500 bill-only minus 400 book-only.</desc><rect width="1120" height="380" rx="20" fill="#f4f7fb"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b42}.h{font-size:28px;font-weight:700}.label{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#465b70}.n{font-size:18px;fill:white;font-weight:700}</style><text x="32" y="49" class="h">Reconciliation: account for both sides</text><text x="32" y="79" class="small">Invented USD example. Original unique-key case only.</text><rect x="32" y="112" width="320" height="125" rx="12" fill="#ffffff" stroke="#cad6e2"/><text x="50" y="147" class="label">Three paired properties</text><text x="50" y="183" class="body">Book $600  |  Bill $610</text><text x="50" y="212" class="body">Paired difference +$10</text><rect x="400" y="112" width="320" height="125" rx="12" fill="#ffffff" stroke="#cad6e2"/><text x="418" y="147" class="label">One book-only property</text><text x="418" y="183" class="body">P-004: $400</text><text x="418" y="212" class="body">Keep visible; do not discard</text><rect x="768" y="112" width="320" height="125" rx="12" fill="#ffffff" stroke="#cad6e2"/><text x="786" y="147" class="label">One bill-only property</text><text x="786" y="183" class="body">P-005: $500</text><text x="786" y="212" class="body">Keep visible; do not guess</text><rect x="32" y="260" width="1056" height="95" rx="12" fill="#e8f2f2" stroke="#cad6e2"/><text x="52" y="299" class="label">Whole-source difference: $1,110 - $1,000 = $110</text><text x="52" y="333" class="body">Bridge: $10 paired difference + $500 bill-only - $400 book-only = $110</text></svg>
