<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Bring the saved research into Excel</title><desc id="desc">Create a new workbook from the CSV. Do not silently change financial amounts. Success: row counts, finding IDs, source links, and review status agree with the memo.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f7f5ef" stroke="none"/><text x="48" y="43" font-size="17" font-weight="700" fill="#16745f">STEP 20  /  TEACHING ILLUSTRATION</text><text x="48" y="92" font-size="38" font-weight="700" fill="#183344">Bring the saved research into Excel</text><text x="48" y="132" font-size="22" font-weight="400" fill="#566573">Create a new workbook from the CSV. Do not silently change financial amounts.</text><rect x="48" y="158" width="1104" height="416" rx="16" fill="white" stroke="#d8e0e4"/><rect x="48" y="158" width="1104" height="48" rx="12" fill="#183344" stroke="none"/><text x="72" y="190" font-size="21" font-weight="600" fill="white">research.xlsx | Research sheet</text><text x="78" y="252" font-size="23" font-weight="700" fill="#16745f">ID</text><text x="199" y="252" font-size="23" font-weight="700" fill="#16745f">Topic</text><text x="485" y="252" font-size="23" font-weight="700" fill="#16745f">Scope</text><text x="690" y="252" font-size="23" font-weight="700" fill="#16745f">Review status</text><text x="894" y="252" font-size="23" font-weight="700" fill="#16745f">Evidence</text><rect x="67" y="279" width="1066" height="60" rx="7" fill="#f7f5ef" stroke="none"/><text x="78" y="318" font-size="23" font-weight="400" fill="#183344">R1</text><text x="199" y="318" font-size="23" font-weight="400" fill="#183344">Official form</text><text x="485" y="318" font-size="23" font-weight="400" fill="#183344">TX / 2026</text><text x="690" y="318" font-size="23" font-weight="400" fill="#183344">Needs review</text><text x="894" y="318" font-size="23" font-weight="400" fill="#183344">Source link</text><rect x="67" y="343" width="1066" height="60" rx="7" fill="#e8f0fa" stroke="none"/><text x="78" y="382" font-size="23" font-weight="400" fill="#183344">R2</text><text x="199" y="382" font-size="23" font-weight="400" fill="#183344">Receiving agency</text><text x="485" y="382" font-size="23" font-weight="400" fill="#183344">Travis / 2026</text><text x="690" y="382" font-size="23" font-weight="400" fill="#183344">Needs review</text><text x="894" y="382" font-size="23" font-weight="400" fill="#183344">Source link</text><rect x="67" y="407" width="1066" height="60" rx="7" fill="#f7f5ef" stroke="none"/><text x="78" y="446" font-size="23" font-weight="400" fill="#183344">R3</text><text x="199" y="446" font-size="23" font-weight="400" fill="#183344">Requested details</text><text x="485" y="446" font-size="23" font-weight="400" fill="#183344">BPP / 2026</text><text x="690" y="446" font-size="23" font-weight="400" fill="#183344">Needs review</text><text x="894" y="446" font-size="23" font-weight="400" fill="#183344">Source link</text><text x="78" y="511" font-size="22" font-weight="400" fill="#566573">Illustrative rows only. Keep full source and review fields in your actual workbook.</text><rect x="48" y="600" width="1104" height="48" rx="10" fill="#e0eee8" stroke="none"/><text x="66" y="632" font-size="22" font-weight="600" fill="#16745f">Success: row counts, finding IDs, source links, and review status agree with the memo.</text></g></svg>