<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Make one change and prove it helps</title><desc id="desc">Keep a complete backup outside the folders where Claude discovers skills. Success: the new check works without losing the previous useful behavior.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f7f5ef" stroke="none"/><text x="48" y="43" font-size="17" font-weight="700" fill="#16745f">STEP 24  /  TEACHING ILLUSTRATION</text><text x="48" y="92" font-size="38" font-weight="700" fill="#183344">Make one change and prove it helps</text><text x="48" y="132" font-size="22" font-weight="400" fill="#566573">Keep a complete backup outside the folders where Claude discovers skills.</text><rect x="48" y="184" width="348" height="356" rx="16" fill="white" stroke="#d8e0e4"/><rect x="70" y="208" width="44" height="44" rx="22" fill="#16745f" stroke="none"/><text x="84" y="239" font-size="24" font-weight="600" fill="white">1</text><text x="70" y="294" font-size="26" font-weight="600" fill="#183344">Back up the folder</text><text x="70" y="336" font-size="22" font-weight="400" fill="#183344">Copy to skill-backups/</text><text x="70" y="368" font-size="22" font-weight="400" fill="#183344">using a new dated folder.</text><text x="70" y="400" font-size="22" font-weight="400" fill="#183344">Confirm the files match.</text><rect x="70" y="462" width="304" height="46" rx="9" fill="#16745f" stroke="none"/><text x="86" y="493" font-size="21" font-weight="600" fill="white">Preserve the whole skill</text><path d="M390 370h40m-12 -10 12 10-12 10" fill="none" stroke="#16745f" stroke-width="4"/><rect x="426" y="184" width="348" height="356" rx="16" fill="white" stroke="#d8e0e4"/><rect x="448" y="208" width="44" height="44" rx="22" fill="#16745f" stroke="none"/><text x="462" y="239" font-size="24" font-weight="600" fill="white">2</text><text x="448" y="294" font-size="26" font-weight="600" fill="#183344">Edit + save</text><text x="448" y="336" font-size="22" font-weight="400" fill="#183344">Add a leading-zero ID check.</text><text x="448" y="368" font-size="22" font-weight="400" fill="#183344">Review the proposed change.</text><text x="448" y="400" font-size="22" font-weight="400" fill="#183344">Open SKILL.md; Ctrl+S.</text><rect x="448" y="462" width="304" height="46" rx="9" fill="#16745f" stroke="none"/><text x="464" y="493" font-size="21" font-weight="600" fill="white">Keep existing checks</text><path d="M768 370h40m-12 -10 12 10-12 10" fill="none" stroke="#16745f" stroke-width="4"/><rect x="804" y="184" width="348" height="356" rx="16" fill="white" stroke="#d8e0e4"/><rect x="826" y="208" width="44" height="44" rx="22" fill="#16745f" stroke="none"/><text x="840" y="239" font-size="24" font-weight="600" fill="white">3</text><text x="826" y="294" font-size="26" font-weight="600" fill="#183344">Reload + retest</text><text x="826" y="336" font-size="22" font-weight="400" fill="#183344">Run the same example.</text><text x="826" y="368" font-size="22" font-weight="400" fill="#183344">Confirm IDs stay text.</text><text x="826" y="400" font-size="22" font-weight="400" fill="#183344">Check totals still agree.</text><rect x="826" y="462" width="304" height="46" rx="9" fill="#16745f" stroke="none"/><text x="842" y="493" font-size="21" font-weight="600" fill="white">Restore backup if needed</text><rect x="48" y="600" width="1104" height="48" rx="10" fill="#e0eee8" stroke="none"/><text x="66" y="632" font-size="22" font-weight="600" fill="#16745f">Success: the new check works without losing the previous useful behavior.</text></g></svg>