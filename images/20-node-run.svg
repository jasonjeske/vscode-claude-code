<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Run one small practice calculation</title><desc id="desc">This command prints a number. It does not read, write, or upload files. Success: the printed difference is 100. </desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f7f5ef" stroke="none"/><text x="48" y="43" font-size="17" font-weight="700" fill="#16745f">OPTIONAL / N2  /  TEACHING ILLUSTRATION</text><text x="48" y="92" font-size="38" font-weight="700" fill="#183344">Run one small practice calculation</text><text x="48" y="132" font-size="22" font-weight="400" fill="#566573">This command prints a number. It does not read, write, or upload files.</text><rect x="48" y="158" width="1104" height="416" rx="16" fill="white" stroke="#d8e0e4"/><rect x="48" y="158" width="1104" height="48" rx="12" fill="#183344" stroke="none"/><text x="72" y="190" font-size="21" font-weight="600" fill="white">Visual Studio Code | Terminal &gt; New Terminal &gt; PowerShell</text><rect x="73" y="230" width="1052" height="293" rx="16" fill="#183344" stroke="none"/><text x="95" y="270" font-size="25" font-weight="400" fill="#d8e9e3">PS C:\...\Tax Practice&gt; node --version</text><text x="95" y="308" font-size="24" font-weight="400" fill="#a4d8c5">v...  (your installed version)</text><text x="95" y="369" font-size="23" font-weight="400" fill="#d8e9e3">node -e &quot;console.log('Practice difference:', 1100 - 1000)&quot;</text><text x="95" y="410" font-size="27" font-weight="400" fill="#a4d8c5">Practice difference: 100</text><text x="95" y="475" font-size="23" font-weight="400" fill="white">Commands run here. Course prompts go in Claude’s chat box.</text><rect x="48" y="600" width="1104" height="48" rx="10" fill="#e0eee8" stroke="none"/><text x="66" y="632" font-size="22" font-weight="600" fill="#16745f">Success: the printed difference is 100. </text></g></svg>