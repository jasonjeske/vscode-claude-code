<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Show the evidence beside the status</title><desc id="desc">A dashboard is a dated snapshot. Source links remain available for checking. Success: filters change the finding counts and details together.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f7f5ef" stroke="none"/><text x="48" y="43" font-size="17" font-weight="700" fill="#16745f">STEP 21  /  TEACHING ILLUSTRATION</text><text x="48" y="92" font-size="38" font-weight="700" fill="#183344">Show the evidence beside the status</text><text x="48" y="132" font-size="22" font-weight="400" fill="#566573">A dashboard is a dated snapshot. Source links remain available for checking.</text><rect x="48" y="158" width="1104" height="416" rx="16" fill="white" stroke="#d8e0e4"/><rect x="48" y="158" width="1104" height="48" rx="12" fill="#183344" stroke="none"/><text x="72" y="190" font-size="21" font-weight="600" fill="white">Research dashboard | Example layout, not research results</text><rect x="72" y="232" width="328" height="112" rx="16" fill="#e8f0fa" stroke="none"/><text x="92" y="270" font-size="24" font-weight="400" fill="#183344">Findings</text><text x="92" y="318" font-size="36" font-weight="700" fill="#16745f">3</text><rect x="436" y="232" width="328" height="112" rx="16" fill="#e8f0fa" stroke="none"/><text x="456" y="270" font-size="24" font-weight="400" fill="#183344">Reviewed</text><text x="456" y="318" font-size="36" font-weight="700" fill="#16745f">1</text><rect x="800" y="232" width="328" height="112" rx="16" fill="#e8f0fa" stroke="none"/><text x="820" y="270" font-size="24" font-weight="400" fill="#183344">Needs review</text><text x="820" y="318" font-size="36" font-weight="700" fill="#16745f">2</text><rect x="72" y="369" width="292" height="46" rx="9" fill="#16745f" stroke="none"/><text x="88" y="400" font-size="21" font-weight="600" fill="white">Jurisdiction + year</text><rect x="385" y="369" width="157" height="46" rx="16" fill="#f7f5ef" stroke="none"/><text x="410" y="400" font-size="23" font-weight="400" fill="#183344">Reset</text><text x="72" y="455" font-size="25" font-weight="600" fill="#183344">Finding | Review status | Source link | Access date</text><text x="72" y="499" font-size="24" font-weight="400" fill="#183344">Show unresolved items. Empty selections say No data.</text><text x="72" y="546" font-size="23" font-weight="400" fill="#566573">Keep research status separate from filing status and tax amounts.</text><rect x="48" y="600" width="1104" height="48" rx="10" fill="#e0eee8" stroke="none"/><text x="66" y="632" font-size="22" font-weight="600" fill="#16745f">Success: filters change the finding counts and details together.</text></g></svg>