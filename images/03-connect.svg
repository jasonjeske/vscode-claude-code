<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Connect, then send your first message</title><desc id="desc">Click inside Claude’s message box before you paste the prompt. Success: Claude replies. No spreadsheet needs to be opened yet.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f7f5ef" stroke="none"/><text x="48" y="43" font-size="17" font-weight="700" fill="#16745f">STEP 3  /  TEACHING ILLUSTRATION</text><text x="48" y="92" font-size="38" font-weight="700" fill="#183344">Connect, then send your first message</text><text x="48" y="132" font-size="22" font-weight="400" fill="#566573">Click inside Claude’s message box before you paste the prompt.</text><rect x="48" y="158" width="1104" height="416" rx="16" fill="white" stroke="#d8e0e4"/><rect x="48" y="158" width="1104" height="48" rx="12" fill="#183344" stroke="none"/><text x="72" y="190" font-size="21" font-weight="600" fill="white">Claude Code | Your approved connection</text><rect x="75" y="234" width="470" height="292" rx="16" fill="#e8f0fa" stroke="none"/><text x="100" y="279" font-size="26" font-weight="600" fill="#183344">Already configured by work?</text><text x="100" y="322" font-size="23" font-weight="400" fill="#183344">Keep that connection.</text><text x="100" y="358" font-size="23" font-weight="400" fill="#183344">Use IT’s sign-in instructions.</text><text x="100" y="394" font-size="23" font-weight="400" fill="#183344">Do not replace managed settings.</text><rect x="584" y="234" width="535" height="292" rx="16" fill="#f7f5ef" stroke="none"/><text x="608" y="279" font-size="26" font-weight="600" fill="#183344">Claude Code message box</text><text x="608" y="328" font-size="23" font-weight="400" fill="#183344">I am new to VS Code and Claude</text><text x="608" y="364" font-size="23" font-weight="400" fill="#183344">Code. Explain how you can help</text><text x="608" y="400" font-size="23" font-weight="400" fill="#183344">with an Excel workbook.</text><rect x="608" y="452" width="270" height="46" rx="9" fill="#16745f" stroke="none"/><text x="624" y="483" font-size="21" font-weight="600" fill="white">Press Enter to send</text><rect x="48" y="600" width="1104" height="48" rx="10" fill="#e0eee8" stroke="none"/><text x="66" y="632" font-size="22" font-weight="600" fill="#16745f">Success: Claude replies. No spreadsheet needs to be opened yet.</text></g></svg>