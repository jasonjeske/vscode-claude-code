<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Build the report from checked data</title><desc id="desc">Example layout. Claude’s output may look different; the control totals must agree. Success: outputs/dashboard.html opens locally, or dashboard.xlsx opens in Excel.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f7f5ef" stroke="none"/><text x="48" y="43" font-size="17" font-weight="700" fill="#16745f">STEP 13  /  TEACHING ILLUSTRATION</text><text x="48" y="92" font-size="38" font-weight="700" fill="#183344">Build the report from checked data</text><text x="48" y="132" font-size="22" font-weight="400" fill="#566573">Example layout. Claude’s output may look different; the control totals must agree.</text><rect x="48" y="158" width="1104" height="416" rx="16" fill="white" stroke="#d8e0e4"/><rect x="48" y="158" width="1104" height="48" rx="12" fill="#183344" stroke="none"/><text x="72" y="190" font-size="21" font-weight="600" fill="white">Invented practice data | Ohio 2026 | All records</text><rect x="72" y="228" width="254" height="104" rx="16" fill="#e8f0fa" stroke="none"/><text x="89" y="261" font-size="22" font-weight="400" fill="#183344">Book total</text><text x="89" y="306" font-size="34" font-weight="700" fill="#16745f">$1,000</text><rect x="341" y="228" width="254" height="104" rx="16" fill="#e8f0fa" stroke="none"/><text x="358" y="261" font-size="22" font-weight="400" fill="#183344">Bill total</text><text x="358" y="306" font-size="34" font-weight="700" fill="#16745f">$1,100</text><rect x="610" y="228" width="254" height="104" rx="16" fill="#e8f0fa" stroke="none"/><text x="627" y="261" font-size="22" font-weight="400" fill="#183344">Full difference</text><text x="627" y="306" font-size="34" font-weight="700" fill="#16745f">+$100</text><rect x="879" y="228" width="254" height="104" rx="16" fill="#e8f0fa" stroke="none"/><text x="896" y="261" font-size="22" font-weight="400" fill="#183344">Matched gross</text><text x="896" y="306" font-size="34" font-weight="700" fill="#16745f">$20</text><rect x="72" y="354" width="302" height="46" rx="9" fill="#16745f" stroke="none"/><text x="88" y="385" font-size="21" font-weight="600" fill="white">Status: All records</text><rect x="397" y="354" width="131" height="46" rx="16" fill="#f7f5ef" stroke="none"/><text x="421" y="385" font-size="23" font-weight="400" fill="#183344">Reset</text><text x="72" y="448" font-size="25" font-weight="700" fill="#183344">Exception detail</text><text x="72" y="488" font-size="21" font-weight="400" fill="#183344">001102   +$10       001103   -$10       001104   Book only       001105   Bill only</text><text x="72" y="542" font-size="21" font-weight="400" fill="#566573">Source: practice.xlsx | Static snapshot | Generation date shown in your report</text><rect x="48" y="600" width="1104" height="48" rx="10" fill="#e0eee8" stroke="none"/><text x="66" y="632" font-size="22" font-weight="600" fill="#16745f">Success: outputs/dashboard.html opens locally, or dashboard.xlsx opens in Excel.</text></g></svg>