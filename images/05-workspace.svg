<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Know where your files and prompts go</title><desc id="desc">Explorer lists files. The editor shows text. Claude has a separate chat box. Success: the left Explorer lists practice.xlsx inside Tax Practice.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f7f5ef" stroke="none"/><text x="48" y="43" font-size="17" font-weight="700" fill="#16745f">STEP 5  /  TEACHING ILLUSTRATION</text><text x="48" y="92" font-size="38" font-weight="700" fill="#183344">Know where your files and prompts go</text><text x="48" y="132" font-size="22" font-weight="400" fill="#566573">Explorer lists files. The editor shows text. Claude has a separate chat box.</text><rect x="48" y="158" width="1104" height="416" rx="16" fill="white" stroke="#d8e0e4"/><rect x="48" y="158" width="1104" height="48" rx="12" fill="#183344" stroke="none"/><text x="72" y="190" font-size="21" font-weight="600" fill="white">File &gt; Open Folder &gt; Tax Practice</text><rect x="48" y="206" width="258" height="368" rx="0" fill="#e8f0fa" stroke="none"/><text x="68" y="244" font-size="19" font-weight="700" fill="#16745f">EXPLORER</text><text x="68" y="286" font-size="24" font-weight="600" fill="#183344">Tax Practice</text><text x="83" y="332" font-size="22" font-weight="400" fill="#183344">practice.xlsx</text><text x="83" y="376" font-size="22" font-weight="400" fill="#183344">ANSWER-KEY.md</text><text x="83" y="420" font-size="22" font-weight="400" fill="#183344">CLAUDE.md</text><rect x="326" y="232" width="360" height="280" rx="16" fill="#f7f5ef" stroke="none"/><text x="345" y="269" font-size="19" font-weight="700" fill="#16745f">EDITOR</text><text x="345" y="315" font-size="26" font-weight="600" fill="#183344">CLAUDE.md</text><text x="345" y="357" font-size="22" font-weight="400" fill="#183344">Text files open here.</text><text x="345" y="393" font-size="22" font-weight="400" fill="#183344">Ctrl+S saves.</text><text x="345" y="429" font-size="22" font-weight="400" fill="#183344">Ctrl+Shift+V previews</text><text x="345" y="465" font-size="22" font-weight="400" fill="#183344">a Markdown file.</text><rect x="709" y="232" width="420" height="280" rx="16" fill="#e0eee8" stroke="none"/><text x="730" y="269" font-size="19" font-weight="700" fill="#16745f">CLAUDE CODE</text><text x="730" y="315" font-size="23" font-weight="400" fill="#183344">Your conversation is here.</text><text x="730" y="351" font-size="23" font-weight="400" fill="#183344">Click its message box</text><text x="730" y="387" font-size="23" font-weight="400" fill="#183344">to paste a prompt.</text><rect x="730" y="427" width="377" height="60" rx="16" fill="white" stroke="#16745f"/><text x="747" y="466" font-size="22" font-weight="400" fill="#566573">Type your request here...</text><rect x="48" y="600" width="1104" height="48" rx="10" fill="#e0eee8" stroke="none"/><text x="66" y="632" font-size="22" font-weight="600" fill="#16745f">Success: the left Explorer lists practice.xlsx inside Tax Practice.</text></g></svg>