<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Research once. Keep the evidence.</title><desc id="desc">Use a public practice question. Keep company details out of public searches. Success: every finding links to a source and identifies its jurisdiction and year.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f7f5ef" stroke="none"/><text x="48" y="43" font-size="17" font-weight="700" fill="#16745f">STEP 18  /  TEACHING ILLUSTRATION</text><text x="48" y="92" font-size="38" font-weight="700" fill="#183344">Research once. Keep the evidence.</text><text x="48" y="132" font-size="22" font-weight="400" fill="#566573">Use a public practice question. Keep company details out of public searches.</text><rect x="48" y="158" width="1104" height="416" rx="16" fill="white" stroke="#d8e0e4"/><rect x="48" y="158" width="1104" height="48" rx="12" fill="#183344" stroke="none"/><text x="72" y="190" font-size="21" font-weight="600" fill="white">Claude Code | property-tax-research</text><rect x="72" y="228" width="491" height="309" rx="16" fill="#e8f0fa" stroke="none"/><text x="94" y="271" font-size="27" font-weight="700" fill="#183344">Ask a scoped question</text><text x="94" y="315" font-size="23" font-weight="400" fill="#183344">Texas / Travis County / 2026</text><text x="94" y="356" font-size="23" font-weight="400" fill="#183344">Business personal property</text><text x="94" y="397" font-size="23" font-weight="400" fill="#183344">Which official form and instructions?</text><text x="94" y="438" font-size="23" font-weight="400" fill="#183344">Read the actual official sources.</text><path d="M578 379h40m-12 -10 12 10-12 10" fill="none" stroke="#16745f" stroke-width="4"/><rect x="642" y="228" width="487" height="309" rx="16" fill="#e0eee8" stroke="none"/><text x="666" y="271" font-size="27" font-weight="700" fill="#183344">Save two useful files</text><text x="666" y="321" font-size="23" font-weight="400" fill="#183344">outputs/research.md</text><text x="666" y="364" font-size="23" font-weight="400" fill="#183344">A short memo with source links</text><text x="666" y="407" font-size="23" font-weight="400" fill="#183344">outputs/research.csv</text><text x="666" y="450" font-size="23" font-weight="400" fill="#183344">One row per finding; Needs review</text><rect x="48" y="600" width="1104" height="48" rx="10" fill="#e0eee8" stroke="none"/><text x="66" y="632" font-size="22" font-weight="600" fill="#16745f">Success: every finding links to a source and identifies its jurisdiction and year.</text></g></svg>