<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Reload the extension, then start fresh</title><desc id="desc">Use the Command Palette at the top of VS Code, not the Claude chat box. Success: a new Claude tab offers your installed skills when you type /.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f7f5ef" stroke="none"/><text x="48" y="43" font-size="17" font-weight="700" fill="#16745f">STEP 8 / HELP  /  TEACHING ILLUSTRATION</text><text x="48" y="92" font-size="38" font-weight="700" fill="#183344">Reload the extension, then start fresh</text><text x="48" y="132" font-size="22" font-weight="400" fill="#566573">Use the Command Palette at the top of VS Code, not the Claude chat box.</text><rect x="48" y="158" width="1104" height="416" rx="16" fill="white" stroke="#d8e0e4"/><rect x="48" y="158" width="1104" height="48" rx="12" fill="#183344" stroke="none"/><text x="72" y="190" font-size="21" font-weight="600" fill="white">Visual Studio Code | Command Palette</text><rect x="167" y="228" width="866" height="65" rx="16" fill="#f7f5ef" stroke="#16745f"/><text x="191" y="270" font-size="29" font-weight="600" fill="#183344">&gt; Developer: Reload Window</text><rect x="167" y="307" width="866" height="55" rx="16" fill="#e8f0fa" stroke="none"/><text x="191" y="344" font-size="25" font-weight="400" fill="#183344">Developer: Reload Window</text><text x="168" y="423" font-size="24" font-weight="400" fill="#183344">1  File &gt; Save All</text><text x="168" y="466" font-size="24" font-weight="400" fill="#183344">2  Ctrl+Shift+P, type the command, then select it</text><text x="168" y="509" font-size="24" font-weight="400" fill="#183344">3  After reload: Claude Code &gt; Open in New Tab</text><rect x="48" y="600" width="1104" height="48" rx="10" fill="#e0eee8" stroke="none"/><text x="66" y="632" font-size="22" font-weight="600" fill="#16745f">Success: a new Claude tab offers your installed skills when you type /.</text></g></svg>