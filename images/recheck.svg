<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">Reuse the format. Recheck the facts.</title><desc id="desc">Recheck this research before we use it. Tell me what changed and save an updated copy. For a different place or year, Claude needs the applicable official sources again. A saved finding needs its own applicability and freshness check.</desc><rect x="0" y="0" width="1200" height="690" rx="0" fill="#f4f3ee" stroke="none"/><text x="40" y="44" font-family="Arial, sans-serif" font-size="28" fill="#283b43" font-weight="700">Reuse the format. Recheck the facts.</text><text x="40" y="74" font-family="Arial, sans-serif" font-size="14" fill="#65746e" font-weight="400">ILLUSTRATED EXAMPLE  ·  Controls and replies may vary</text><rect x="40" y="96" width="1120" height="534" rx="12" fill="#ffffff" stroke="#cbd1ce"/><rect x="40" y="96" width="1120" height="42" rx="0" fill="#e6e9e7" stroke="none"/><text x="62" y="123" font-family="Arial, sans-serif" font-size="17" fill="#283b43" font-weight="400">Visual Studio Code</text><text x="474" y="123" font-family="Arial, sans-serif" font-size="17" fill="#283b43" font-weight="400">Tax Practice</text><text x="1100" y="123" font-family="Arial, sans-serif" font-size="21" fill="#283b43" font-weight="400">×</text><rect x="40" y="138" width="235" height="492" rx="0" fill="#f1f3f2" stroke="none"/><text x="59" y="176" font-family="Arial, sans-serif" font-size="15" fill="#61716c" font-weight="700">EXPLORER</text><text x="59" y="215" font-family="Arial, sans-serif" font-size="17" fill="#283b43" font-weight="700">⌄ TAX PRACTICE</text><text x="76" y="256" font-family="Arial, sans-serif" font-size="17" fill="#283b43" font-weight="400">practice.xlsx</text><text x="76" y="293" font-family="Arial, sans-serif" font-size="17" fill="#283b43" font-weight="400">OH-bills.xlsx</text><text x="76" y="330" font-family="Arial, sans-serif" font-size="17" fill="#283b43" font-weight="400">TX-bills.xlsx</text><text x="76" y="367" font-family="Arial, sans-serif" font-size="17" fill="#283b43" font-weight="400">▸ outputs</text><text x="305" y="177" font-family="Arial, sans-serif" font-size="23" fill="#a15338" font-weight="700">✳ Claude Code</text><text x="1026" y="176" font-family="Arial, sans-serif" font-size="16" fill="#64706a" font-weight="400">History  +</text><rect x="305" y="205" width="825" height="147" rx="12" fill="#f7f5ef" stroke="#e1dfd5"/><text x="327" y="239" font-family="Arial, sans-serif" font-size="21" fill="#283b43" font-weight="400">For a different place or year, Claude needs the applicable</text><text x="327" y="270" font-family="Arial, sans-serif" font-size="21" fill="#283b43" font-weight="400">official sources again.</text><text x="305" y="390" font-family="Arial, sans-serif" font-size="14" fill="#65746e" font-weight="700">YOUR NEXT MESSAGE</text><rect x="305" y="407" width="825" height="159" rx="12" fill="#fff" stroke="#b78368"/><text x="325" y="442" font-family="Arial, sans-serif" font-size="22" fill="#283b43" font-weight="400">Recheck this research before we use it. Tell me what changed and</text><text x="325" y="473" font-family="Arial, sans-serif" font-size="22" fill="#283b43" font-weight="400">save an updated copy.</text><text x="325" y="546" font-family="Arial, sans-serif" font-size="15" fill="#68766f" font-weight="400">Manual</text><text x="1040" y="546" font-family="Arial, sans-serif" font-size="22" fill="#68766f" font-weight="400">/</text><rect x="1082" y="526" width="32" height="30" rx="6" fill="#b16543" stroke="none"/><text x="1089" y="548" font-family="Arial, sans-serif" font-size="23" fill="#fff" font-weight="400">↑</text><text x="40" y="669" font-family="Arial, sans-serif" font-size="20" fill="#355e62" font-weight="400">A saved finding needs its own applicability and freshness check.</text></svg>