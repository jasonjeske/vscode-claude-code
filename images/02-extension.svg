<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Add Claude Code to VS Code</title><desc id="desc">Extensions adds the assistant to your editor. This is not the skills menu. Success: Claude Code is installed and its conversation panel opens.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f7f5ef" stroke="none"/><text x="48" y="43" font-size="17" font-weight="700" fill="#16745f">STEP 2  /  TEACHING ILLUSTRATION</text><text x="48" y="92" font-size="38" font-weight="700" fill="#183344">Add Claude Code to VS Code</text><text x="48" y="132" font-size="22" font-weight="400" fill="#566573">Extensions adds the assistant to your editor. This is not the skills menu.</text><rect x="48" y="158" width="1104" height="416" rx="16" fill="white" stroke="#d8e0e4"/><rect x="48" y="158" width="1104" height="48" rx="12" fill="#183344" stroke="none"/><text x="72" y="190" font-size="21" font-weight="600" fill="white">Visual Studio Code | Extensions</text><rect x="48" y="206" width="75" height="368" rx="0" fill="#e8f0fa" stroke="none"/><text x="66" y="252" font-size="24" font-weight="700" fill="#16745f">EX</text><rect x="144" y="228" width="330" height="48" rx="16" fill="#f7f5ef" stroke="none"/><text x="164" y="260" font-size="25" font-weight="400" fill="#183344">Claude Code</text><rect x="144" y="299" width="640" height="219" rx="16" fill="#e8f0fa" stroke="none"/><text x="170" y="345" font-size="32" font-weight="700" fill="#183344">Claude Code</text><text x="170" y="384" font-size="24" font-weight="400" fill="#183344">Publisher: Anthropic</text><rect x="170" y="430" width="160" height="46" rx="9" fill="#16745f" stroke="none"/><text x="186" y="461" font-size="21" font-weight="600" fill="white">Install</text><text x="824" y="282" font-size="22" font-weight="400" fill="#183344">1  Ctrl+Shift+X</text><text x="824" y="330" font-size="22" font-weight="400" fill="#183344">2  Search the name</text><text x="824" y="378" font-size="22" font-weight="400" fill="#183344">3  Check publisher</text><text x="824" y="426" font-size="22" font-weight="400" fill="#183344">4  Click Install</text><rect x="48" y="600" width="1104" height="48" rx="10" fill="#e0eee8" stroke="none"/><text x="66" y="632" font-size="22" font-weight="600" fill="#16745f">Success: Claude Code is installed and its conversation panel opens.</text></g></svg>