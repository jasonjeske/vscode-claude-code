<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Turn workpapers into a reviewer draft</title><desc id="desc">Summarize supported findings. Keep evidence, open questions, and next actions. Success: the draft is concise, supported, and honest about unfinished work.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f7f5ef" stroke="none"/><text x="48" y="43" font-size="17" font-weight="700" fill="#16745f">STEP 28  /  TEACHING ILLUSTRATION</text><text x="48" y="92" font-size="38" font-weight="700" fill="#183344">Turn workpapers into a reviewer draft</text><text x="48" y="132" font-size="22" font-weight="400" fill="#566573">Summarize supported findings. Keep evidence, open questions, and next actions.</text><rect x="48" y="184" width="348" height="356" rx="16" fill="white" stroke="#d8e0e4"/><rect x="70" y="208" width="44" height="44" rx="22" fill="#16745f" stroke="none"/><text x="84" y="239" font-size="24" font-weight="600" fill="white">1</text><text x="70" y="294" font-size="26" font-weight="600" fill="#183344">Read the source</text><text x="70" y="336" font-size="22" font-weight="400" fill="#183344">outputs/reconciliation.md</text><text x="70" y="368" font-size="22" font-weight="400" fill="#183344">Confirm scope and totals.</text><text x="70" y="400" font-size="22" font-weight="400" fill="#183344">Keep net and gross distinct.</text><rect x="70" y="462" width="304" height="46" rx="9" fill="#16745f" stroke="none"/><text x="86" y="493" font-size="21" font-weight="600" fill="white">Use workpaper-summary</text><path d="M390 370h40m-12 -10 12 10-12 10" fill="none" stroke="#16745f" stroke-width="4"/><rect x="426" y="184" width="348" height="356" rx="16" fill="white" stroke="#d8e0e4"/><rect x="448" y="208" width="44" height="44" rx="22" fill="#16745f" stroke="none"/><text x="462" y="239" font-size="24" font-weight="600" fill="white">2</text><text x="448" y="294" font-size="26" font-weight="600" fill="#183344">Save a short draft</text><text x="448" y="336" font-size="22" font-weight="400" fill="#183344">Result + main exceptions</text><text x="448" y="368" font-size="22" font-weight="400" fill="#183344">Evidence + review questions</text><text x="448" y="400" font-size="22" font-weight="400" fill="#183344">Actions, owners, and dates</text><rect x="448" y="462" width="304" height="46" rx="9" fill="#16745f" stroke="none"/><text x="464" y="493" font-size="21" font-weight="600" fill="white">Unknown = Not provided</text><path d="M768 370h40m-12 -10 12 10-12 10" fill="none" stroke="#16745f" stroke-width="4"/><rect x="804" y="184" width="348" height="356" rx="16" fill="white" stroke="#d8e0e4"/><rect x="826" y="208" width="44" height="44" rx="22" fill="#16745f" stroke="none"/><text x="840" y="239" font-size="24" font-weight="600" fill="white">3</text><text x="826" y="294" font-size="26" font-weight="600" fill="#183344">Review before use</text><text x="826" y="336" font-size="22" font-weight="400" fill="#183344">Open reviewer-summary.md.</text><text x="826" y="368" font-size="22" font-weight="400" fill="#183344">Check one cited finding.</text><text x="826" y="400" font-size="22" font-weight="400" fill="#183344">Correct unsupported claims.</text><rect x="826" y="462" width="304" height="46" rx="9" fill="#16745f" stroke="none"/><text x="842" y="493" font-size="21" font-weight="600" fill="white">No automatic sending</text><rect x="48" y="600" width="1104" height="48" rx="10" fill="#e0eee8" stroke="none"/><text x="66" y="632" font-size="22" font-weight="600" fill="#16745f">Success: the draft is concise, supported, and honest about unfinished work.</text></g></svg>