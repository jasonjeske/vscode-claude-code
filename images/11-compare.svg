<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Keep differences and unmatched items visible</title><desc id="desc">Practice matching key: State + Tax Year + text Property ID. Check duplicates first. Success: missing counterparts stay missing, and opposing differences remain visible.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f7f5ef" stroke="none"/><text x="48" y="43" font-size="17" font-weight="700" fill="#16745f">STEP 11  /  TEACHING ILLUSTRATION</text><text x="48" y="92" font-size="38" font-weight="700" fill="#183344">Keep differences and unmatched items visible</text><text x="48" y="132" font-size="22" font-weight="400" fill="#566573">Practice matching key: State + Tax Year + text Property ID. Check duplicates first.</text><rect x="48" y="158" width="1104" height="416" rx="16" fill="white" stroke="#d8e0e4"/><rect x="48" y="158" width="1104" height="48" rx="12" fill="#183344" stroke="none"/><text x="72" y="190" font-size="21" font-weight="600" fill="white">Reconciliation | Bill minus Book</text><text x="82" y="252" font-size="23" font-weight="700" fill="#16745f">Property ID</text><text x="318" y="252" font-size="23" font-weight="700" fill="#16745f">Book</text><text x="466" y="252" font-size="23" font-weight="700" fill="#16745f">Bill</text><text x="622" y="252" font-size="23" font-weight="700" fill="#16745f">Difference</text><text x="842" y="252" font-size="23" font-weight="700" fill="#16745f">Status</text><rect x="67" y="277" width="1066" height="49" rx="5" fill="#f7f5ef" stroke="none"/><text x="82" y="309" font-size="24" font-weight="400" fill="#183344">001101</text><text x="318" y="309" font-size="24" font-weight="400" fill="#183344">$100</text><text x="466" y="309" font-size="24" font-weight="400" fill="#183344">$100</text><text x="622" y="309" font-size="24" font-weight="400" fill="#183344">$0</text><text x="842" y="309" font-size="24" font-weight="400" fill="#183344">Exact match</text><rect x="67" y="329" width="1066" height="49" rx="5" fill="white" stroke="none"/><text x="82" y="361" font-size="24" font-weight="400" fill="#183344">001102</text><text x="318" y="361" font-size="24" font-weight="400" fill="#183344">$200</text><text x="466" y="361" font-size="24" font-weight="400" fill="#183344">$210</text><text x="622" y="361" font-size="24" font-weight="400" fill="#183344">+$10</text><text x="842" y="361" font-size="24" font-weight="400" fill="#183344">Difference</text><rect x="67" y="381" width="1066" height="49" rx="5" fill="#f7f5ef" stroke="none"/><text x="82" y="413" font-size="24" font-weight="400" fill="#183344">001103</text><text x="318" y="413" font-size="24" font-weight="400" fill="#183344">$300</text><text x="466" y="413" font-size="24" font-weight="400" fill="#183344">$290</text><text x="622" y="413" font-size="24" font-weight="400" fill="#183344">-$10</text><text x="842" y="413" font-size="24" font-weight="400" fill="#183344">Difference</text><rect x="67" y="433" width="1066" height="49" rx="5" fill="white" stroke="none"/><text x="82" y="465" font-size="24" font-weight="400" fill="#183344">001104</text><text x="318" y="465" font-size="24" font-weight="400" fill="#183344">$400</text><text x="466" y="465" font-size="24" font-weight="400" fill="#183344">Missing</text><text x="622" y="465" font-size="24" font-weight="400" fill="#183344">n/a</text><text x="842" y="465" font-size="24" font-weight="400" fill="#183344">Book only</text><rect x="67" y="485" width="1066" height="49" rx="5" fill="#f7f5ef" stroke="none"/><text x="82" y="517" font-size="24" font-weight="400" fill="#183344">001105</text><text x="318" y="517" font-size="24" font-weight="400" fill="#183344">Missing</text><text x="466" y="517" font-size="24" font-weight="400" fill="#183344">$500</text><text x="622" y="517" font-size="24" font-weight="400" fill="#183344">n/a</text><text x="842" y="517" font-size="24" font-weight="400" fill="#183344">Bill only</text><rect x="48" y="600" width="1104" height="48" rx="10" fill="#e0eee8" stroke="none"/><text x="66" y="632" font-size="22" font-weight="600" fill="#16745f">Success: missing counterparts stay missing, and opposing differences remain visible.</text></g></svg>