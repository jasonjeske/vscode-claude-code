<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Save a short handoff for tomorrow</title><desc id="desc">Use one related objective per conversation. Keep the next action easy to find. Success: you can find the output and explain one number without rereading the chat.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f7f5ef" stroke="none"/><text x="48" y="43" font-size="17" font-weight="700" fill="#16745f">STEP 16  /  TEACHING ILLUSTRATION</text><text x="48" y="92" font-size="38" font-weight="700" fill="#183344">Save a short handoff for tomorrow</text><text x="48" y="132" font-size="22" font-weight="400" fill="#566573">Use one related objective per conversation. Keep the next action easy to find.</text><rect x="48" y="184" width="348" height="356" rx="16" fill="white" stroke="#d8e0e4"/><rect x="70" y="208" width="44" height="44" rx="22" fill="#16745f" stroke="none"/><text x="84" y="239" font-size="24" font-weight="600" fill="white">1</text><text x="70" y="294" font-size="26" font-weight="600" fill="#183344">Finish one result</text><text x="70" y="336" font-size="22" font-weight="400" fill="#183344">What did we complete?</text><text x="70" y="368" font-size="22" font-weight="400" fill="#183344">Where are the outputs?</text><text x="70" y="400" font-size="22" font-weight="400" fill="#183344">What checks passed?</text><rect x="70" y="462" width="304" height="46" rx="9" fill="#16745f" stroke="none"/><text x="86" y="493" font-size="21" font-weight="600" fill="white">Ask Claude to summarize</text><path d="M390 370h40m-12 -10 12 10-12 10" fill="none" stroke="#16745f" stroke-width="4"/><rect x="426" y="184" width="348" height="356" rx="16" fill="white" stroke="#d8e0e4"/><rect x="448" y="208" width="44" height="44" rx="22" fill="#16745f" stroke="none"/><text x="462" y="239" font-size="24" font-weight="600" fill="white">2</text><text x="448" y="294" font-size="26" font-weight="600" fill="#183344">Save a short note</text><text x="448" y="336" font-size="22" font-weight="400" fill="#183344">Keep unresolved items.</text><text x="448" y="368" font-size="22" font-weight="400" fill="#183344">Name one next action.</text><text x="448" y="400" font-size="22" font-weight="400" fill="#183344">Preserve existing notes.</text><rect x="448" y="462" width="304" height="46" rx="9" fill="#16745f" stroke="none"/><text x="464" y="493" font-size="21" font-weight="600" fill="white">outputs/next-step.md</text><path d="M768 370h40m-12 -10 12 10-12 10" fill="none" stroke="#16745f" stroke-width="4"/><rect x="804" y="184" width="348" height="356" rx="16" fill="white" stroke="#d8e0e4"/><rect x="826" y="208" width="44" height="44" rx="22" fill="#16745f" stroke="none"/><text x="840" y="239" font-size="24" font-weight="600" fill="white">3</text><text x="826" y="294" font-size="26" font-weight="600" fill="#183344">Resume tomorrow</text><text x="826" y="336" font-size="22" font-weight="400" fill="#183344">Open the same folder.</text><text x="826" y="368" font-size="22" font-weight="400" fill="#183344">Start a fresh Claude tab.</text><text x="826" y="400" font-size="22" font-weight="400" fill="#183344">Read the note and verify.</text><rect x="826" y="462" width="304" height="46" rx="9" fill="#16745f" stroke="none"/><text x="842" y="493" font-size="21" font-weight="600" fill="white">Continue from the evidence</text><rect x="48" y="600" width="1104" height="48" rx="10" fill="#e0eee8" stroke="none"/><text x="66" y="632" font-size="22" font-weight="600" fill="#16745f">Success: you can find the output and explain one number without rereading the chat.</text></g></svg>