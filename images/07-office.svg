<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Add the spreadsheet procedures</title><desc id="desc">Use the same plugin panel to add Anthropic’s document-skills package. Success: document-skills appears installed. Its spreadsheet skill is xlsx.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f7f5ef" stroke="none"/><text x="48" y="43" font-size="17" font-weight="700" fill="#16745f">STEP 7  /  TEACHING ILLUSTRATION</text><text x="48" y="92" font-size="38" font-weight="700" fill="#183344">Add the spreadsheet procedures</text><text x="48" y="132" font-size="22" font-weight="400" fill="#566573">Use the same plugin panel to add Anthropic’s document-skills package.</text><rect x="48" y="158" width="1104" height="416" rx="16" fill="white" stroke="#d8e0e4"/><rect x="48" y="158" width="1104" height="48" rx="12" fill="#183344" stroke="none"/><text x="72" y="190" font-size="21" font-weight="600" fill="white">Claude Code | /plugins | Manage plugins</text><rect x="75" y="230" width="505" height="296" rx="16" fill="#e8f0fa" stroke="none"/><text x="98" y="270" font-size="28" font-weight="700" fill="#183344">Marketplaces</text><text x="98" y="318" font-size="22" font-weight="400" fill="#183344">Add this source:</text><rect x="98" y="342" width="458" height="52" rx="16" fill="white" stroke="none"/><text x="112" y="376" font-size="23" font-weight="400" fill="#183344">anthropics/skills</text><rect x="98" y="431" width="245" height="46" rx="9" fill="#16745f" stroke="none"/><text x="114" y="462" font-size="21" font-weight="600" fill="white">Add marketplace</text><path d="M583 368h40m-12 -10 12 10-12 10" fill="none" stroke="#16745f" stroke-width="4"/><rect x="638" y="230" width="488" height="296" rx="16" fill="#e0eee8" stroke="none"/><text x="660" y="270" font-size="28" font-weight="700" fill="#183344">Plugins</text><text x="660" y="320" font-size="25" font-weight="600" fill="#183344">document-skills</text><text x="660" y="360" font-size="20" font-weight="400" fill="#566573">from anthropic-agent-skills</text><rect x="660" y="401" width="140" height="46" rx="9" fill="#16745f" stroke="none"/><text x="676" y="432" font-size="21" font-weight="600" fill="white">Install</text><text x="660" y="488" font-size="23" font-weight="400" fill="#183344">Scope: Install for you</text><rect x="48" y="600" width="1104" height="48" rx="10" fill="#e0eee8" stroke="none"/><text x="66" y="632" font-size="22" font-weight="600" fill="#16745f">Success: document-skills appears installed. Its spreadsheet skill is xlsx.</text></g></svg>