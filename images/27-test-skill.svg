<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Test the skill on a workbook you can check</title><desc id="desc">Use invented data first. A menu entry alone does not establish correctness. Success: the custom skill produces checkable results and states its limits.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f7f5ef" stroke="none"/><text x="48" y="43" font-size="17" font-weight="700" fill="#16745f">STEP 23  /  TEACHING ILLUSTRATION</text><text x="48" y="92" font-size="38" font-weight="700" fill="#183344">Test the skill on a workbook you can check</text><text x="48" y="132" font-size="22" font-weight="400" fill="#566573">Use invented data first. A menu entry alone does not establish correctness.</text><rect x="48" y="184" width="348" height="356" rx="16" fill="white" stroke="#d8e0e4"/><rect x="70" y="208" width="44" height="44" rx="22" fill="#16745f" stroke="none"/><text x="84" y="239" font-size="24" font-weight="600" fill="white">1</text><text x="70" y="294" font-size="26" font-weight="600" fill="#183344">Reload + open chat</text><text x="70" y="336" font-size="22" font-weight="400" fill="#183344">File &gt; Save All</text><text x="70" y="368" font-size="22" font-weight="400" fill="#183344">Developer: Reload Window</text><text x="70" y="400" font-size="22" font-weight="400" fill="#183344">Claude: Open in New Tab</text><rect x="70" y="462" width="304" height="46" rx="9" fill="#16745f" stroke="none"/><text x="86" y="493" font-size="21" font-weight="600" fill="white">Stay in Tax Practice</text><path d="M390 370h40m-12 -10 12 10-12 10" fill="none" stroke="#16745f" stroke-width="4"/><rect x="426" y="184" width="348" height="356" rx="16" fill="white" stroke="#d8e0e4"/><rect x="448" y="208" width="44" height="44" rx="22" fill="#16745f" stroke="none"/><text x="462" y="239" font-size="24" font-weight="600" fill="white">2</text><text x="448" y="294" font-size="26" font-weight="600" fill="#183344">Choose your skill</text><text x="448" y="336" font-size="22" font-weight="400" fill="#183344">Type /my-excel-check.</text><text x="448" y="368" font-size="22" font-weight="400" fill="#183344">Ask to inspect practice.xlsx.</text><text x="448" y="400" font-size="22" font-weight="400" fill="#183344">Keep the original unchanged.</text><rect x="448" y="462" width="304" height="46" rx="9" fill="#16745f" stroke="none"/><text x="464" y="493" font-size="21" font-weight="600" fill="white">Check the loaded source</text><path d="M768 370h40m-12 -10 12 10-12 10" fill="none" stroke="#16745f" stroke-width="4"/><rect x="804" y="184" width="348" height="356" rx="16" fill="white" stroke="#d8e0e4"/><rect x="826" y="208" width="44" height="44" rx="22" fill="#16745f" stroke="none"/><text x="840" y="239" font-size="24" font-weight="600" fill="white">3</text><text x="826" y="294" font-size="26" font-weight="600" fill="#183344">Verify the result</text><text x="826" y="336" font-size="22" font-weight="400" fill="#183344">Book and Bill sheets</text><text x="826" y="368" font-size="22" font-weight="400" fill="#183344">4 detail rows per sheet</text><text x="826" y="400" font-size="22" font-weight="400" fill="#183344">Compare totals in Excel.</text><rect x="826" y="462" width="304" height="46" rx="9" fill="#16745f" stroke="none"/><text x="842" y="493" font-size="21" font-weight="600" fill="white">Then read the answer key</text><rect x="48" y="600" width="1104" height="48" rx="10" fill="#e0eee8" stroke="none"/><text x="66" y="632" font-size="22" font-weight="600" fill="#16745f">Success: the custom skill produces checkable results and states its limits.</text></g></svg>