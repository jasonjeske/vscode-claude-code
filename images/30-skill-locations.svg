<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Reuse an approved skill across folders</title><desc id="desc">Copy the complete folder. Keep one active copy and back up the old location. Success: the skill works on an invented example in a second work folder.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f7f5ef" stroke="none"/><text x="48" y="43" font-size="17" font-weight="700" fill="#16745f">STEP 26  /  TEACHING ILLUSTRATION</text><text x="48" y="92" font-size="38" font-weight="700" fill="#183344">Reuse an approved skill across folders</text><text x="48" y="132" font-size="22" font-weight="400" fill="#566573">Copy the complete folder. Keep one active copy and back up the old location.</text><rect x="48" y="158" width="1104" height="416" rx="16" fill="white" stroke="#d8e0e4"/><rect x="48" y="158" width="1104" height="48" rx="12" fill="#183344" stroke="none"/><text x="72" y="190" font-size="21" font-weight="600" fill="white">Choose where your skill belongs</text><rect x="72" y="230" width="487" height="307" rx="16" fill="#e8f0fa" stroke="none"/><text x="96" y="274" font-size="25" font-weight="700" fill="#16745f">PROJECT</text><text x="96" y="320" font-size="24" font-weight="400" fill="#183344">Tax Practice/</text><text x="96" y="364" font-size="24" font-weight="400" fill="#183344">.claude/skills/my-excel-check/</text><text x="96" y="408" font-size="24" font-weight="400" fill="#183344">SKILL.md</text><text x="96" y="452" font-size="24" font-weight="400" fill="#183344">Available in that work folder.</text><path d="M578 379h40m-12 -10 12 10-12 10" fill="none" stroke="#16745f" stroke-width="4"/><rect x="642" y="230" width="487" height="307" rx="16" fill="#e0eee8" stroke="none"/><text x="666" y="274" font-size="25" font-weight="700" fill="#16745f">PERSONAL</text><text x="666" y="320" font-size="24" font-weight="400" fill="#183344">Your Windows user folder/</text><text x="666" y="364" font-size="24" font-weight="400" fill="#183344">.claude/skills/my-excel-check/</text><text x="666" y="408" font-size="24" font-weight="400" fill="#183344">SKILL.md</text><text x="666" y="452" font-size="24" font-weight="400" fill="#183344">Available across local projects.</text><rect x="48" y="600" width="1104" height="48" rx="10" fill="#e0eee8" stroke="none"/><text x="66" y="632" font-size="22" font-weight="600" fill="#16745f">Success: the skill works on an invented example in a second work folder.</text></g></svg>