<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Ask for a formula and its test cases</title><desc id="desc">Bill minus Book: preserve signs, and keep blank inputs distinct from zero. Success: Excel returns 10, -10, 0, and Missing after recalculation.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f7f5ef" stroke="none"/><text x="48" y="43" font-size="17" font-weight="700" fill="#16745f">STEP 27  /  TEACHING ILLUSTRATION</text><text x="48" y="92" font-size="38" font-weight="700" fill="#183344">Ask for a formula and its test cases</text><text x="48" y="132" font-size="22" font-weight="400" fill="#566573">Bill minus Book: preserve signs, and keep blank inputs distinct from zero.</text><rect x="48" y="158" width="1104" height="416" rx="16" fill="white" stroke="#d8e0e4"/><rect x="48" y="158" width="1104" height="48" rx="12" fill="#183344" stroke="none"/><text x="72" y="190" font-size="21" font-weight="600" fill="white">New formula-practice.xlsx | Test before using on work data</text><text x="91" y="251" font-size="24" font-weight="700" fill="#16745f">Row</text><text x="270" y="251" font-size="24" font-weight="700" fill="#16745f">Book (B)</text><text x="466" y="251" font-size="24" font-weight="700" fill="#16745f">Bill (C)</text><text x="706" y="251" font-size="24" font-weight="700" fill="#16745f">Expected Difference (D)</text><rect x="72" y="276" width="1056" height="50" rx="6" fill="#f7f5ef" stroke="none"/><text x="91" y="310" font-size="25" font-weight="400" fill="#183344">2</text><text x="270" y="310" font-size="25" font-weight="400" fill="#183344">100</text><text x="466" y="310" font-size="25" font-weight="400" fill="#183344">110</text><text x="706" y="310" font-size="25" font-weight="400" fill="#183344">10</text><rect x="72" y="330" width="1056" height="50" rx="6" fill="#e8f0fa" stroke="none"/><text x="91" y="364" font-size="25" font-weight="400" fill="#183344">3</text><text x="270" y="364" font-size="25" font-weight="400" fill="#183344">100</text><text x="466" y="364" font-size="25" font-weight="400" fill="#183344">90</text><text x="706" y="364" font-size="25" font-weight="400" fill="#183344">-10</text><rect x="72" y="384" width="1056" height="50" rx="6" fill="#f7f5ef" stroke="none"/><text x="91" y="418" font-size="25" font-weight="400" fill="#183344">4</text><text x="270" y="418" font-size="25" font-weight="400" fill="#183344">0</text><text x="466" y="418" font-size="25" font-weight="400" fill="#183344">0</text><text x="706" y="418" font-size="25" font-weight="400" fill="#183344">0</text><rect x="72" y="438" width="1056" height="50" rx="6" fill="#e8f0fa" stroke="none"/><text x="91" y="472" font-size="25" font-weight="400" fill="#183344">5</text><text x="270" y="472" font-size="25" font-weight="400" fill="#183344">100</text><text x="466" y="472" font-size="25" font-weight="400" fill="#183344">blank</text><text x="706" y="472" font-size="25" font-weight="400" fill="#183344">Missing</text><text x="92" y="540" font-size="23" font-weight="400" fill="#566573">Paste the formula in D2. Select D2:D5, then Home &gt; Fill &gt; Down.</text><rect x="48" y="600" width="1104" height="48" rx="10" fill="#e0eee8" stroke="none"/><text x="66" y="632" font-size="22" font-weight="600" fill="#16745f">Success: Excel returns 10, -10, 0, and Missing after recalculation.</text></g></svg>