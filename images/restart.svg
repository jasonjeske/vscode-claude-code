<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">If reload did not help, restart the app</title><desc id="desc">Save your work first Windows: close every VS Code window using X Open Start &gt; Visual Studio Code Open File &gt; Open Recent &gt; your work folder Mac: Code &gt; Quit Visual Studio Code, then reopen it from Applications.</desc><rect x="0" y="0" width="1200" height="690" rx="0" fill="#f4f3ee" stroke="none"/><text x="40" y="44" font-family="Arial, sans-serif" font-size="28" fill="#283b43" font-weight="700">If reload did not help, restart the app</text><text x="40" y="74" font-family="Arial, sans-serif" font-size="14" fill="#65746e" font-weight="400">ILLUSTRATED EXAMPLE  ·  Controls and replies may vary</text><rect x="40" y="100" width="1120" height="515" rx="12" fill="#fff" stroke="#ced5d1"/><rect x="40" y="100" width="1120" height="43" rx="0" fill="#e6e9e7" stroke="none"/><text x="63" y="128" font-family="Arial, sans-serif" font-size="18" fill="#283b43" font-weight="400">Visual Studio Code</text><rect x="67" y="165" width="78" height="425" rx="8" fill="#eff2ef" stroke="none"/><text x="91" y="216" font-family="Arial, sans-serif" font-size="30" fill="#283b43" font-weight="400">▣</text><text x="91" y="284" font-family="Arial, sans-serif" font-size="30" fill="#283b43" font-weight="400">⌕</text><text x="91" y="353" font-family="Arial, sans-serif" font-size="30" fill="#283b43" font-weight="400">⊞</text><text x="91" y="423" font-family="Arial, sans-serif" font-size="30" fill="#a15338" font-weight="400">✳</text><text x="178" y="202" font-family="Arial, sans-serif" font-size="27" fill="#283b43" font-weight="700">Save your work first</text><rect x="178" y="219" width="931" height="48" rx="6" fill="#f1f5f2" stroke="none"/><text x="198" y="251" font-family="Arial, sans-serif" font-size="22" fill="#283b43" font-weight="400">Windows: close every VS Code window using X</tex