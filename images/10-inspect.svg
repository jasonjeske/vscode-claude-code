ze="24" font-weight="400" fill="#183344">Book sheet</text><text x="821" y="368" font-size="24" font-weight="400" fill="#183344">Bill sheet</text><text x="821" y="410" font-size="24" font-weight="400" fill="#183344">4 detail rows each</text><text x="821" y="452" font-size="24" font-weight="400" fill="#183344">Source totals</text><rect x="48" y="600" width="1104" height="48" rx="10" fill="#e0eee8" stroke="none"/><text x="66" y="632" font-size="22" font-weight="600" fill="#16745f">Success: a saved workbook map describes the real sheets and detail rows.</text></g></svg>