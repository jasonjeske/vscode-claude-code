<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Add the next three skills</title><desc id="desc">Use the same plugin, then open a separate folder for your research practice. Success: the new commands are visible in your research workspace.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="680" rx="0" fill="#f7f5ef" stroke="none"/><text x="48" y="43" font-size="17" font-weight="700" fill="#16745f">STEP 17  /  TEACHING ILLUSTRATION</text><text x="48" y="92" font-size="38" font-weight="700" fill="#183344">Add the next three skills</text><text x="48" y="132" font-size="22" font-weight="400" fill="#566573">Use the same plugin, then open a separate folder for your research practice.</text><rect x="48" y="184" width="348" height="356" rx="16" fill="white" stroke="#d8e0e4"/><rect x="70" y="208" width="44" height="44" rx="22" fill="#16745f" stroke="none"/><text x="84" y="239" font-size="24" font-weight="600" fill="white">1</text><text x="70" y="294" font-size="26" font-weight="600" fill="#183344">Update the kit</text><text x="70" y="336" font-size="22" font-weight="400" fill="#183344">Claude chat: /plugins</text><text x="70" y="368" font-size="22" font-weight="400" fill="#183344">Refresh the marketplace.</text><text x="70" y="400" font-size="22" font-weight="400" fill="#183344">Check installed version.</text><rect x="70" y="462" width="304" height="46" rx="9" fill="#16745f" stroke="none"/><text x="86" y="493" font-size="21" font-weight="600" fill="white">2.1.0 or newer</text><path d="M390 370h40m-12 -10 12 10-12 10" fill="none" stroke="#16745f" stroke-width="4"/><rect x="426" y="184" width="348" height="356" rx="16" fill="white" stroke="#d8e0e4"/><rect x="448" y="208" width="44" height="44" rx="22" fill="#16745f" stroke="none"/><text x="462" y="239" font-size="24" font-weight="600" fill="white">2</text><text x="448" y="294" font-size="26" font-weight="600" fill="#183344">Reload + check</text><text x="448" y="336" font-size="22" font-weight="400" fill="#183344">Start a fresh Claude tab.</text><text x="448" y="368" font-size="22" font-weight="400" fill="#183344">Find research, formula,</text><text x="448" y="400" font-size="22" font-weight="400" fill="#183344">and summary commands.</text><rect x="448" y="462" width="304" height="46" rx="9" fill="#16745f" stroke="none"/><text x="464" y="493" font-size="21" font-weight="600" fill="white">Use / to see skills</text><path d="M768 370h40m-12 -10 12 10-12 10" fill="none" stroke="#16745f" stroke-width="4"/><rect x="804" y="184" width="348" height="356" rx="16" fill="white" stroke="#d8e0e4"/><rect x="826" y="208" width="44" height="44" rx="22" fill="#16745f" stroke="none"/><text x="840" y="239" font-size="24" font-weight="600" fill="white">3</text><text x="826" y="294" font-size="26" font-weight="600" fill="#183344">Open a work folder</text><text x="826" y="336" font-size="22" font-weight="400" fill="#183344">Create Tax Research Practice</text><text x="826" y="368" font-size="22" font-weight="400" fill="#183344">in approved storage.</text><text x="826" y="400" font-size="22" font-weight="400" fill="#183344">VS Code: File &gt; Open Folder</text><rect x="826" y="462" width="304" height="46" rx="9" fill="#16745f" stroke="none"/><text x="842" y="493" font-size="21" font-weight="600" fill="white">Keep research separate</text><rect x="48" y="600" width="1104" height="48" rx="10" fill="#e0eee8" stroke="none"/><text x="66" y="632" font-size="22" font-weight="600" fill="#16745f">Success: the new commands are visible in your research workspace.</text></g></svg>